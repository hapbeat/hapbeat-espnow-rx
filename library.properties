name=HapbeatEspNowRx
version=0.1.0
author=Hapbeat
maintainer=Hapbeat <yus988@hapbeat.com>
sentence=Receive a Hapbeat ESP-NOW audio broadcast on any ESP32 board and play it out over I2S.
paragraph=A Hapbeat transmitter encodes a line-level feed and broadcasts it over ESP-NOW. There is no pairing and no association, so every receiver on the same Wi-Fi channel hears the same stream and the listener count is limited only by radio range. This library is the receiving half: source selection, sequence tracking, piggyback loss recovery, a drift-correcting jitter buffer, and a dedicated I2S output task. IMA-ADPCM stream modes decode with zero dependencies; Opus modes are opt-in via a build flag. ESP32 family only (ESP-NOW + driver/i2s.h).
category=Communication
url=https://github.com/hapbeat/hapbeat-espnow-rx
architectures=esp32
