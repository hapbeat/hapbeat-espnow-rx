; Multi-board build/flash harness for hapbeat-espnow-rx.
; Lives in extras/ (ignored by the Arduino IDE). The sketch (src/main.cpp) is
; the Generic_I2S_Receiver example, so only the board and the I2S pins change
; per environment.
;
;   pio run -e generic_esp32                          # build
;   pio run -e cores3 -t upload --upload-port COMx    # flash
;   pio run -e cores3_opus                            # with Opus modes enabled
;   pio run                                           # default env (generic_esp32)
;
; Set the I2S pins for your wiring with -DPIN_BCLK / -DPIN_LRCK / -DPIN_DOUT,
; and the radio channel with -DHB_CHANNEL (must match the transmitter).

[platformio]
default_envs = generic_esp32
src_dir = src

[env]
; Pinned to the version hapbeat-device-firmware builds with (the unpinned latest
; espressif32 hits a littlefs-python import bug in this PlatformIO install).
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
; Find hapbeat-espnow-rx one level up (repos-sdk/) via the local source tree.
lib_extra_dirs = ../../..

; ---- plain ESP32 dev board + I2S DAC ----
[env:generic_esp32]
board = esp32dev

; ---- M5Stack boards ----
[env:cores3]
board = m5stack-cores3

[env:core2]
board = m5stack-core2

[env:core]
board = m5stack-core-esp32

; ---- Opus stream modes (1-5, 8, 9) ----
; ADPCM modes (0 SOLID / 6 LITE / 7 TURBO) need none of this; the transmitter's
; default is mode 0, so build this env only when the TX is set to an Opus mode.
[env:cores3_opus]
board = m5stack-cores3
; The sketch includes codec/HapbeatOpusBackendImpl.h and calls
; hapbeat::useOpusBackend(). -DHAPBEAT_ESPNOW_RX_OPUS only selects that path in
; main.cpp; the library itself never includes <opus.h> (it cannot — PlatformIO
; does not put a project lib_deps on a library's own include path, whatever
; lib_ldf_mode is set to).
build_flags = -DHAPBEAT_ESPNOW_RX_OPUS
lib_deps = https://github.com/pschatzmann/arduino-libopus.git
